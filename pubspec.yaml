name: learnturn
description: "LearnTurn — Online tutor–student web app. Find tutors, book sessions, learn."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # UI & utils
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Forms & validation (optional; using plain TextFormField in app)
  # flutter_form_builder: ^10.3.0+2
  # form_builder_validators: ^11.0.0

  # Optional: payments (Stripe)
  flutter_stripe: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
